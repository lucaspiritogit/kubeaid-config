apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    kubeaid.io/version: HEAD
    kubeaid.io/managed-by: kubeaid
    kubeaid.io/sync-order: "10"
  name: cluster-autoscaler
  namespace: argocd
spec:
  destination:
    namespace: cluster-autoscaler
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://github.com/Archisman-Mridha/KubeAid
      path: argocd-helm-charts/cluster-autoscaler
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/k8s/qa-htz1-kilroy-eu/argocd-apps/values-cluster-autoscaler.yaml
    - repoURL: git@github.com:lucaspiritogit/kubeaid-config.git
      targetRevision: HEAD
      ref: values
  project: kubeaid
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
